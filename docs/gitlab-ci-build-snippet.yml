# Overrides zu den generierten Jobs — exakter Tag, Drosselung, Trigger.

build:buildah:cho-prod:
  variables:
    IMAGE_TAG: "4.0.5-1"
  resource_group: image-build-1
  rules:
    - changes: [apps/cho-prod/**/*]

