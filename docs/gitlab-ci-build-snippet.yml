# Build- und Sign-Jobs für .gitlab-ci.yml — Vorlage, keine aktive Konfiguration.
#
# Diese Datei wird von GitLab nicht gelesen. Sie ist zum Hineinkopieren in
# .gitlab-ci.yml gedacht, weil dort schon von Hand ergänzte Jobs stehen können
# und ein Überschreiben der ganzen Datei die verlieren würde.
#
# Erzeugt aus registry.yml — jeder IMAGE_TAG unten ist die Tag-Hälfte des
# image_tag der zugehörigen Instanz. Ändert sich dort etwas, ändert sich hier
# etwas, sonst zieht der Deploy einen Tag, den niemand gebaut hat.
#
# Zwei Dinge, die die Komponente allein nicht liefert:
#
#   IMAGE_TAG        Ohne Override taggt die Komponente latest + Commit-SHA.
#                    registry.yml verlangt den exakten <version>-<palette build>
#                    Tag (decision 5), also wird er pro Job gesetzt.
#
#   resource_group   Nur ein Job pro Gruppe läuft gleichzeitig. Drei Gruppen im
#                    Wechsel heißt: höchstens drei Images gleichzeitig, der Rest
#                    wartet. Ohne das baut die Pipeline alle zwölf parallel und
#                    zieht den Runner leer.

include:
  - component: $CI_SERVER_FQDN/infrastructure/ci-cd-catalog/buildah/buildah-build@~latest
    inputs:
      stage: Build
      job_name: build:buildah:cho-prod
      dockerfile: apps/cho-prod/Dockerfile
      image_name: dap-node-red/cho-prod
      enable_layers_cache: false
  - component: $CI_SERVER_FQDN/infrastructure/ci-cd-catalog/cosign/cosign-sign@~latest
    inputs:
      stage: Sign
      job_name: sign:cosign:cho-prod
      image_name: dap-node-red/cho-prod
    needs:
      - job: build:buildah:cho-prod

  - component: $CI_SERVER_FQDN/infrastructure/ci-cd-catalog/buildah/buildah-build@~latest
    inputs:
      stage: Build
      job_name: build:buildah:cho-test
      dockerfile: apps/cho-test/Dockerfile
      image_name: dap-node-red/cho-test
      enable_layers_cache: false
  - component: $CI_SERVER_FQDN/infrastructure/ci-cd-catalog/cosign/cosign-sign@~latest
    inputs:
      stage: Sign
      job_name: sign:cosign:cho-test
