# dap-node-red — build and validation pipeline
#
# GitLab CI does everything that needs no site access: validation, image build,
# signing. Deployment to the site servers lives in the Jenkinsfile, because
# Jenkins holds the per-host SSH credentials. See docs/architecture.md.

variables:
  CI_REGISTRY: $HARBOR_REGISTRY
  CI_REGISTRY_USER: $HARBOR_USER
  CI_REGISTRY_PASSWORD: $HARBOR_PASSWORD

stages:
  - Scan
  - Validate
  - Build
  - Sign

include:
  # Semgrep Scan
  - component: $CI_SERVER_FQDN/infrastructure/ci-cd-catalog/semgrep/semgrep-scan@~latest
    inputs:
      stage: Scan
      job_name: scan:semgrep
      ruleset: p/python p/gitleaks p/security-audit p/secrets p/dockerfile p/command-injection p/ci
      allow_failure: true
  # Trivy Scan
  - component: $CI_SERVER_FQDN/infrastructure/ci-cd-catalog/trivy/trivy-scan@~latest
    inputs:
      stage: Scan
      job_name: scan:trivy
      allow_failure: true
  # Hadolint Scan
  - component: $CI_SERVER_FQDN/infrastructure/ci-cd-catalog/hadolint/hadolint-scan@~latest
    inputs:
      stage: Scan
      job_name: scan:hadolint
      dockerfile: '**/Dockerfile*'
      allow_failure: true

scan:semgrep:
  rules:
    - when: always

scan:trivy:
  rules:
    - when: always

scan:hadolint:
  rules:
    - when: always

validate:registry:
  stage: Validate
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir -r scripts/requirements.txt
  script:
    # --draft while image tags and Jenkins credential ids are still placeholders.
    # Drop the flag once they are filled in; the job then fails on any CHANGEME.
    - python3 scripts/validate-registry.py --draft
  rules:
    - changes:
        - registry.yml
        - schemas/**/*
        - apps/**/*

# Still to come, once the scripts they call exist (see docs/open-questions.md):
#
#   validate:normalize  — every apps/*/flows.json equals its normalized form
#   validate:external   — no function node declares its own npm module,
#                         which is what keeps the baked image a real guarantee
#   build:buildah:*     — one image per apps/<app>/Dockerfile
#   sign:cosign:*       — matching the existing image-signing convention
