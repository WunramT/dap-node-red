    admin_root: ""
    auth_credential_id: nodered-gor-prod-auth
    credential_secret_id: nodered-gor-prod-credsecret
    dns_search: []
    image_tag: CHANGEME  # running node-red 4.0.5, 94 nodes, 7 palette modules
