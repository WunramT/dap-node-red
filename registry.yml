# Instance inventory. Field reference: docs/registry.md
#
# Every admin_root below was probed, not parsed — it is the path the running
# instance answers 401 on. Node-RED versions are the versions actually running.
#
# Two values are not yet known and are marked CHANGEME:
#   - image_tag             waits on the Harbor project (open question 4)
#   - *_credential_id       waits on the Jenkins credentials being created
#
# credential_secret_id refers to a credential holding the instance's EXISTING
# generated key, read from .config.runtime.json during the backup gate. Pinning
# to a new value re-encrypts and breaks every stored credential — see
# docs/runbook.md before creating any of them.

global_variables: {}

instances:
  # --- cho-svr-lin01 --------------------------------------------------------
  # Was logging at level "trace" while every other instance logged at "info";
  # normalized back to "info" with the credentialSecret pin (decision 13).
  - name: cho-prod
    host: cho-svr-lin01
    compose_service: node-red-prod
    app: cho-prod
    admin_root: /node-red-prod
    auth_credential_id: nodered-cho-prod-auth
    credential_secret_id: nodered-cho-prod-credsecret
    dns_search: [cho.polipol.intra, rah.polipol.intra]
    image_tag: CHANGEME  # running node-red 4.0.5, 68 nodes, no palette
    variables: {}

  - name: cho-test
    host: cho-svr-lin01
    compose_service: node-red-test
    app: cho-test
    admin_root: /node-red-test
    auth_credential_id: nodered-cho-test-auth
    credential_secret_id: nodered-cho-test-credsecret
    dns_search: [cho.polipol.intra, rah.polipol.intra]
    image_tag: CHANGEME  # running node-red 4.0.5, 6 nodes, no palette
    variables: {}

  # --- gor-svr-lin01 --------------------------------------------------------
