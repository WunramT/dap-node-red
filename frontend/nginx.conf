# =============================================================================
# Rate Limiting Zones (http-level configuration)
# -----------------------------------------------------------------------------
# These zones track request rates per client IP address.
# - login_limit: Strict limit for authentication endpoints (5 requests/minute)
#                Protects against brute-force password attacks.
# - api_limit: General API limit (10 requests/second) to prevent abuse.
# =============================================================================
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;


# =============================================================================
# Default Server Block
# -----------------------------------------------------------------------------
# Catches requests with invalid or missing Host headers.
# Returns 444 (connection closed without response) to discourage scanning.
# This prevents direct IP access and host header injection attacks.
# =============================================================================
server {
    listen 80 default_server;
    server_name _;
    return 444;
}


# =============================================================================
# Main Application Server
# =============================================================================
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    # HSTS: Force HTTPS for 2 years, include subdomains, enable preload list
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Prevent clickjacking by denying all framing (stricter than SAMEORIGIN)
    add_header X-Frame-Options "DENY" always;
    # Prevent MIME-type sniffing attacks
    add_header X-Content-Type-Options "nosniff" always;
    # Control referrer information sent to other origins
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Disable access to sensitive browser features not used by this application
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Content Security Policy - restrictive but allows necessary functionality
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: https://login.microsoftonline.com https://*.sentry.io https://sentry.polipol-service.pl; worker-src 'self' blob:; frame-src 'self' https://login.microsoftonline.com; frame-ancestors 'none';" always;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # -------------------------------------------------------------------------
    # Timeouts (reduced for security - prevent slow loris attacks)
    # -------------------------------------------------------------------------
    client_body_timeout 60s;
    client_max_body_size 16M;

    # -------------------------------------------------------------------------
    # Authentication Endpoint (strict rate limiting)
    # -------------------------------------------------------------------------
    # Protects against brute-force password attacks: 5 req/min with burst of 3
    location ${VITE_BASE_PATH}api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        resolver 127.0.0.11 valid=30s;
        set $backend_upstream ${BACKEND_HOST};

        rewrite ^${VITE_BASE_PATH}api/(.*)$ /api/$1 break;

        proxy_pass http://$backend_upstream:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # API Proxy (with rate limiting and base path handling)
    # -------------------------------------------------------------------------
    location ${VITE_BASE_PATH}api/ {
        limit_req zone=api_limit burst=20 nodelay;

        # Docker DNS resolver for dynamic backend container name resolution
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream ${BACKEND_HOST};

        rewrite ^${VITE_BASE_PATH}api/(.*)$ /api/$1 break;

        proxy_pass http://$backend_upstream:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        proxy_redirect / ${VITE_BASE_PATH};
    }

    # Handle dynamic base path (for reverse proxy deployment)
    location ${VITE_BASE_PATH} {
        # WICHTIG: Trailing Slashes bei alias, damit Nginx die Pfade korrekt zusammensetzt
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ ${VITE_BASE_PATH}index.html;
    }

    # Cache static assets with dynamic prefix
    location ~* ^${VITE_BASE_PATH}(.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot))$ {
        alias /usr/share/nginx/html/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy with base path stripping (regex fallback)
    location ~ ^${VITE_BASE_PATH}api/(.*)$ {
        limit_req zone=api_limit burst=20 nodelay;

        # Docker DNS resolver for dynamic backend container name resolution
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream ${BACKEND_HOST};

        # Rewrite to strip the base path before proxying
        rewrite ^${VITE_BASE_PATH}api/(.*)$ /api/$1 break;

        # Backend host set via envsubst at container startup, not user input
        # Public API endpoint - internal directive would break frontend-to-backend communication
        # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host, generic.nginx.security.missing-internal.missing-internal
        proxy_pass http://$backend_upstream:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # SPA routing - serve index.html for all routes (fallback for dev/localhost)
    # Dies fängt Anfragen ab, die nicht unter dem Base-Path laufen (z.B. wenn Base-Path = '/')
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (fallback for dev/localhost)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------------
    # Socket.IO Proxy (WebSocket support)
    # -------------------------------------------------------------------------
    location ${VITE_BASE_PATH}socket.io/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream ${BACKEND_HOST};

        # Strip base path before proxying
        rewrite ^${VITE_BASE_PATH}socket.io/(.*)$ /socket.io/$1 break;

        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket connections need longer timeouts for persistent connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -------------------------------------------------------------------------
    # API Proxy (fallback for dev/localhost without base path)
    # -------------------------------------------------------------------------
    location /api {
        limit_req zone=api_limit burst=20 nodelay;

        # Docker DNS resolver for dynamic backend container name resolution
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream ${BACKEND_HOST};

        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Health Check Endpoint
    # -------------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}