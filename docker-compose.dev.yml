services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: dapnodered_postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5466:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # pgAdmin Database Management
  pg_admin:
    image: dpage/pgadmin4:latest
    container_name: dapnodered_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5086:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app-network

  # Backend Service (FastAPI API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dapnodered_backend
    env_file:
      - ./.env
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=app_db
      - DATABASE_USER=dev_user
      - DATABASE_PASSWORD=dev_password
      - DEBUG=True
      - SECRET_KEY=dev-local-secret-key-for-development-only-32chars
      - CORS_ORIGINS=http://localhost:3034,http://frontend:3000
      # Sentry Configuration
      - SENTRY_DSN=${SENTRY_BACKEND_DSN:-}
      - SENTRY_ENVIRONMENT=development
      - SENTRY_TRACES_SAMPLE_RATE=1.0
      - SENTRY_PROFILES_SAMPLE_RATE=1.0
    ports:
      - "8034:8000"
      - "5712:5678"  # debugpy
    volumes:
      - ./backend:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    command: ["bash", "/app/entrypoint.sh"]

  # Frontend Service (Vue + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: dapnodered_frontend
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      # Backend host for nginx proxy (dev uses direct service name)
      - BACKEND_HOST=backend
      # Auth setting derived from ENABLE_AUTH in .env
      - VITE_ENABLE_AUTH=${ENABLE_AUTH:-false}
      # Vite HMR client port (randomized per project, must match external port mapping)
      - VITE_HMR_CLIENT_PORT=24712
      - DNS_RESOLVER=127.0.0.11
    ports:
      - "3034:3000"
      - "24712:24678"  # Vite HMR
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules  # Anonymous volume for node_modules
    depends_on:
      - backend
    networks:
      - app-network
    stdin_open: true
    tty: true
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  # DevContainer Service (for VS Code DevContainer)
  devcontainer:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dapnodered_devcontainer
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=app_db
      - DATABASE_USER=dev_user
      - DATABASE_PASSWORD=dev_password
      - DEBUG=True
    volumes:
      - .:/workspace:cached
      - python-packages:/root/.local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: []
    command: sleep infinity
    stdin_open: true
    tty: true

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  python-packages:
  pgadmin_data:
