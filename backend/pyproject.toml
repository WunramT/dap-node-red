# =============================================================================
# Backend Python Project Configuration
# =============================================================================
# This file configures ruff as the unified linter and formatter for the backend.
# Ruff replaces pylint, flake8, black, and isort with a single fast tool.
#
# Usage:
#   ruff check .          # Run linter
#   ruff check --fix .    # Auto-fix linting issues
#   ruff format .         # Format code
#   ruff format --check . # Check formatting without changes
# =============================================================================

[tool.ruff]
# Target Python version for syntax checks
target-version = "py312"

# Maximum line length (matches previous black configuration)
line-length = 120

# Exclude common non-source directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations/versions",
    ".pytest_cache",
]

[tool.ruff.lint]
# Selected rule sets:
# E/W  - pycodestyle errors and warnings (PEP 8 style)
# F    - pyflakes (unused imports, undefined names)
# I    - isort (import sorting)
# N    - pep8-naming (naming conventions)
# UP   - pyupgrade (modernize syntax for target Python version)
# B    - flake8-bugbear (common bugs and design problems)
# S    - flake8-bandit (security issues)
# SIM  - flake8-simplify (simplification suggestions)
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
]

# Ignored rules:
# S101 - assert statements are fine in tests
# S324 - SHA-256 is used for prehashing before bcrypt, not as password hash (false positive)
ignore = [
    "S101",  # assert in tests is expected
    "S324",  # SHA-256 prehash before bcrypt is secure (see security.py)
]

[tool.ruff.lint.isort]
# Ensure app module imports are grouped correctly
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Allow assert in test files
"tests/**/*.py" = ["S101"]
# Allow hardcoded passwords in test fixtures and seed scripts (development only)
"tests/fixtures/*.py" = ["S105", "S106"]
"scripts/seed_dev_data.py" = ["S105", "S106"]

[tool.ruff.format]
# Use double quotes for strings (consistent with previous black configuration)
quote-style = "double"

# Use Unix-style line endings
line-ending = "lf"
