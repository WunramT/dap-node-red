# BACKEND Build and Test Pipeline
variables:
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  PYTHON_VERSION: "3.13"

include:
  - component: $CI_SERVER_FQDN/infrastructure/ci-cd-catalog/buildah/buildah-build@~latest
    inputs:
      stage: Build
      job_name: build:buildah:backend
      dockerfile: backend/Dockerfile
      image_name: {{HARBOR_PATH}}
      build_secrets:
        - id=pypi_user,env=PYPI_USER,type=env
        - id=pypi_password,env=PYPI_PASSWORD,type=env
      enable_layers_cache: false
  # Sign Docker image with Cosign
  - component: $CI_SERVER_FQDN/infrastructure/ci-cd-catalog/cosign/cosign-sign@~latest
    inputs:
      stage: Sign
      image_name: {{HARBOR_PATH}}
      job_name: sign:cosign:backend

# -----------------------------------------------------------------------------
# Lint: Run ruff linter and formatter check
# -----------------------------------------------------------------------------
# Non-blocking warnings - helps maintain code quality without breaking builds.
# Developers should fix warnings before merging to main.
lint:backend:
  stage: Test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install --no-cache-dir ruff>=0.5
  script:
    - cd backend
    - echo "=== Running ruff linter ==="
    - ruff check . --output-format=grouped || true
    - echo "=== Checking code formatting ==="
    - ruff format --check . || true
    - echo "=== Lint check complete (warnings only, non-blocking) ==="
  allow_failure: true
  rules:
    - changes:
        - backend/**/*

# Run pytest tests
test:backend:
  stage: Test
  image: python:${PYTHON_VERSION}-slim
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
  services:
    - name: postgres:18-alpine
      alias: postgres
      variables:
        POSTGRES_DB: test_db
        POSTGRES_USER: test_user
        POSTGRES_PASSWORD: test_password
  variables:
    # Async URL for application/tests (asyncpg driver)
    DATABASE_URL: "postgresql+asyncpg://test_user:test_password@postgres:5432/test_db"
    # Sync URL for Alembic migrations (psycopg2 driver)
    SYNC_DATABASE_URL: "postgresql://test_user:test_password@postgres:5432/test_db"
    SECRET_KEY: "test-secret-key-for-ci-pipeline-minimum-32-chars"
    ENABLE_AUTH: "false"
  before_script:
    - cd backend
    - pip install --no-cache-dir -r requirements.txt
    - pip install pytest pytest-asyncio pytest-cov pytest-mock httpx
    # Run Alembic migrations to create database tables
    - DATABASE_URL=$SYNC_DATABASE_URL alembic -c migrations/alembic.ini upgrade head
  script:
    - pytest -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    when: always
  needs:
    - job: scan:semgrep
    - job: scan:trivy
    - job: scan:hadolint
  rules:
    - changes:
        - backend/**/*


### Job Rules and dependencies for Build and Sign jobs ###

build:buildah:backend:
  needs:
    - job: test:backend
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: 
      - backend/**/*

sign:cosign:backend:
  needs:
    - job: build:buildah:backend
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: 
      - backend/**/*
